<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .lane { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .ui { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; }
      .store { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; }
      .llm { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; }
      .t { font-size: 14px; fill: #0f172a; font-weight: 600; }
      .s { font-size: 11.5px; fill: #475569; }
      .h { font-size: 15px; fill: #334155; font-weight: 700; letter-spacing: .5px; }
      .ln { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="1000" height="560" fill="#ffffff"/>

  <!-- Lane 1: ingestion -->
  <rect class="lane" x="20" y="20" width="960" height="200" rx="14"/>
  <text class="h" x="40" y="48">1 · INGEST  (Library page)</text>

  <rect class="ui" x="40" y="70" width="150" height="70" rx="10"/>
  <text class="t" x="115" y="100" text-anchor="middle">Upload</text>
  <text class="s" x="115" y="120" text-anchor="middle">PDF · DOCX · TXT · MD</text>

  <rect class="box" x="225" y="70" width="150" height="70" rx="10"/>
  <text class="t" x="300" y="100" text-anchor="middle">Parse</text>
  <text class="s" x="300" y="120" text-anchor="middle">text per page + title</text>

  <rect class="box" x="410" y="70" width="150" height="70" rx="10"/>
  <text class="t" x="485" y="100" text-anchor="middle">Chunk</text>
  <text class="s" x="485" y="120" text-anchor="middle">sentence-aware, overlap</text>

  <rect class="box" x="595" y="70" width="150" height="70" rx="10"/>
  <text class="t" x="670" y="100" text-anchor="middle">Embed + Tokenize</text>
  <text class="s" x="670" y="120" text-anchor="middle">bge-small · BM25 terms</text>

  <rect class="store" x="780" y="62" width="180" height="140" rx="10"/>
  <text class="t" x="870" y="90" text-anchor="middle">data/ folder</text>
  <text class="s" x="870" y="114" text-anchor="middle">uploads/  original files</text>
  <text class="s" x="870" y="134" text-anchor="middle">index/chunks.jsonl</text>
  <text class="s" x="870" y="154" text-anchor="middle">index/embeddings.npy</text>
  <text class="s" x="870" y="174" text-anchor="middle">index/documents.json</text>

  <path class="ln" d="M190,105 H221"/>
  <path class="ln" d="M375,105 H406"/>
  <path class="ln" d="M560,105 H591"/>
  <path class="ln" d="M745,105 H776"/>

  <!-- Lane 2: query -->
  <rect class="lane" x="20" y="250" width="960" height="290" rx="14"/>
  <text class="h" x="40" y="278">2 · ASK  (Ask page)</text>

  <rect class="ui" x="40" y="300" width="150" height="70" rx="10"/>
  <text class="t" x="115" y="330" text-anchor="middle">Question</text>
  <text class="s" x="115" y="350" text-anchor="middle">+ optional paper filter</text>

  <rect class="box" x="225" y="290" width="150" height="50" rx="10"/>
  <text class="t" x="300" y="312" text-anchor="middle">Dense search</text>
  <text class="s" x="300" y="329" text-anchor="middle">cosine · top 30</text>

  <rect class="box" x="225" y="350" width="150" height="50" rx="10"/>
  <text class="t" x="300" y="372" text-anchor="middle">BM25 search</text>
  <text class="s" x="300" y="389" text-anchor="middle">keywords · top 30</text>

  <rect class="box" x="410" y="300" width="150" height="70" rx="10"/>
  <text class="t" x="485" y="330" text-anchor="middle">RRF fusion</text>
  <text class="s" x="485" y="350" text-anchor="middle">merge both rankings</text>

  <rect class="box" x="595" y="300" width="150" height="70" rx="10"/>
  <text class="t" x="670" y="330" text-anchor="middle">Cross-encoder rerank</text>
  <text class="s" x="670" y="350" text-anchor="middle">keep best 6 chunks</text>

  <rect class="llm" x="780" y="300" width="180" height="70" rx="10"/>
  <text class="t" x="870" y="327" text-anchor="middle">Command R7B</text>
  <text class="s" x="870" y="347" text-anchor="middle">local via Ollama · grounded</text>

  <rect class="ui" x="595" y="440" width="365" height="76" rx="10"/>
  <text class="t" x="777" y="468" text-anchor="middle">Streamed answer with [n] citations</text>
  <text class="s" x="777" y="490" text-anchor="middle">source cards → paper title, page, snippet, open PDF at page</text>

  <path class="ln" d="M190,325 C205,325 205,315 221,315"/>
  <path class="ln" d="M190,345 C205,345 205,375 221,375"/>
  <path class="ln" d="M375,315 C392,315 392,330 406,330"/>
  <path class="ln" d="M375,375 C392,375 392,345 406,345"/>
  <path class="ln" d="M560,335 H591"/>
  <path class="ln" d="M745,335 H776"/>
  <path class="ln" d="M870,370 V436"/>
  <path class="ln dash" d="M670,370 V436"/>
  <text class="s" x="560" y="410">sources sent first</text>

  <!-- index feeds retrieval -->
  <path class="ln dash" d="M870,202 C870,240 300,235 300,286"/>
  <text class="s" x="560" y="236">reads index</text>
</svg>
